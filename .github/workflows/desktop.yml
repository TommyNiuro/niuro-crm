name: Release build (macOS + Windows)

# Construye los instaladores de escritorio en Mac y Windows.
# - workflow_dispatch: build de prueba (sube artifacts, no toca releases).
# - push de tag vX.Y.Z: build + adjunta los instaladores al Release del tag.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # Go para compilar el bridge de WhatsApp. En Windows necesita CGO (compilador
      # C); si no está disponible, build-desktop.sh arma el instalador SIN bridge
      # (no es fatal). CGO_ENABLED=1 lo intenta igual.
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Cache cargo + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Install dependencies
        run: npm ci

      - name: Build desktop app
        run: npm run desktop:build
        shell: bash
        env:
          CGO_ENABLED: "1"

      # El bundler de .dmg de Tauri es frágil; en Mac distribuimos el .app zippeado.
      - name: Package macOS .app (zip)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent "src-tauri/target/release/bundle/macos/Niuro CRM.app" "Niuro-CRM-macos.zip"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: niuro-crm-${{ runner.os }}
          path: |
            Niuro-CRM-macos.zip
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Niuro-CRM-macos.zip
            src-tauri/target/release/bundle/nsis/*.exe
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
