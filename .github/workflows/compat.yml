# Verificación de compatibilidad multi-plataforma (Windows + macOS Intel + macOS ARM).
# Manual (workflow_dispatch) a propósito: los runners macOS facturan minutos 10x y
# Windows 2x; el CI de cada push ya cubre Linux (ci.yml). Correr esto antes de un
# release o al tocar código sensible a plataforma (spawn, paths, módulo nativo).
name: Compat

on:
  workflow_dispatch:

jobs:
  compat:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15-intel, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Install dependencies
        run: npm ci

      - name: Módulo nativo cifrado (prebuild correcto para esta plataforma)
        run: node -e "const db=require('better-sqlite3')(':memory:'); console.log('cipher:', db.prepare('SELECT sqlite3mc_version() v').get().v); db.close()"

      - name: Bridge de WhatsApp compila (Go, esta plataforma)
        run: npm run bridge:build

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Init DB
        run: npm run init

      - name: Boot smoke (server arriba + gate de cuenta)
        run: |
          (PORT=3999 npm start > server.log 2>&1 &)
          ok=0
          for i in $(seq 1 60); do
            sleep 2
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3999/setup-account || true)
            if [ "$code" = "200" ]; then ok=1; break; fi
          done
          if [ "$ok" != "1" ]; then
            echo "el server no levantó"; tail -60 server.log; exit 1
          fi
          echo "server OK"
          curl -s -o /dev/null -w "GET / -> %{http_code} (redirect: %{redirect_url})\n" http://localhost:3999/
