<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Niuro CRM</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        height: 100%;
        background: #0f172a;
        color: #f8fafc;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
        -webkit-user-select: none;
        user-select: none;
      }
      .wrap {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
      }
      .logo {
        width: 64px;
        height: 64px;
        border-radius: 16px;
        background: #10b981;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 34px;
        font-weight: 700;
        color: #0f172a;
      }
      .title { font-size: 20px; font-weight: 600; letter-spacing: 0.2px; }
      #spinner {
        width: 26px;
        height: 26px;
        border: 3px solid rgba(255, 255, 255, 0.15);
        border-top-color: #10b981;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      #msg { font-size: 13px; color: #94a3b8; max-width: 320px; text-align: center; line-height: 1.5; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="logo">N</div>
      <div class="title">Niuro CRM</div>
      <div id="spinner"></div>
      <div id="msg">Iniciando el servidor local...</div>
    </div>
  </body>
</html>
